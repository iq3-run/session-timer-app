language: "ja-JP"

early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/*.g.dart"
    - "!**/*.freezed.dart"
    - "!build/**"
    - "!.dart_tool/**"
  path_instructions:
    - path: ".claude/agent-memory/**"
      instructions: >
        These are AI coding-agent session records, not human-authored docs.
        Dates recorded here (e.g. "reviewed 2026-08-17") reflect the actual
        session date, which is verified via the `date` shell command and can
        legitimately be the day of or after the PR's commit date. Do not flag
        such dates as future/incorrect relative to the commit timestamp.
    - path: "plans/**"
      instructions: >
        These are AI-agent-authored implementation plan files, not
        traditional design docs. Dates recorded here reflect the actual
        session date (verified via the `date` shell command) and can
        legitimately be the day of or after the PR's commit date. Do not flag
        such dates as future/incorrect relative to the commit timestamp.

chat:
  auto_reply: true
