name: Markdown Lint

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.markdownlint.yaml'
  pull_request:
    paths:
      - '**.md'
      - '.markdownlint.yaml'

permissions:
  contents: read

jobs:
  lint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: DavidAnson/markdownlint-cli2-action@v9
        with:
          globs: |
            **/*.md
            !build/**
            !docs/**
            !ios/**
            !android/**
            # Subagent-authored memory notes (.claude/agent-memory/), not
            # house-style content meant for human authors.
            !.claude/**
