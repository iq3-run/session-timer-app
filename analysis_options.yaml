include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # public_member_api_docs: this is an app, not a published package — doc
    # comments on every public member would violate the repo's "no WHAT
    # comments" policy (CLAUDE.md) more than they'd help.
    public_member_api_docs: false
